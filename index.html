<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>道德经阅读器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="道德经">
    <link rel="stylesheet" href="style.css">
    <script src="xlsx.full.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</head>
<body>
<header>
    <div style="display:flex;align-items:center;gap:8px;">
        <div class="book-select-wrap">
            <select id="bookSelect" class="header-title"></select>
            <span class="book-select-arrow">▾</span>
        </div>
        <span id="chapterType" class="chapter-type"></span>
    </div>
    <div class="toolbar">
        <button id="openCatalog">目录</button>
        <button onclick="toggleTheme()">🌓</button>
    </div>
</header>

<div class="container">
    <div class="tab-wrap">
        <div class="tab-item active" data-view="yuanwen">原文</div>
        <div class="tab-item" data-view="zhushi">注释</div>
        <div class="tab-item" data-view="zongjie">总结</div>
    </div>

    <div class="content-card">
        <div class="read-content" id="readWrap">
            <div class="loading-tip">正在加载数据...</div>
            <div class="view active" id="yuanwen">
                <div class="chap-title"></div>
                <div class="yuanwen-text"></div>
            </div>
            <div class="view" id="zhushi">
                <div class="chap-title"></div>
                <div class="zhushi-text"></div>
            </div>
            <div class="view" id="zongjie">
                <div class="chap-title"></div>
                <div class="zongjie-text"></div>
            </div>
        </div>
    </div>
    <div class="link-card">
        <span class="link-tab">相关章节</span><br>
        <span class="link-item" id="link"></span>
    </div>
    <div class="page-nav">
        <button id="prevBtn" class="content-nav">上一章</button>
        <button id="copyBtn" class="content-nav">复制原文</button>
        <button id="nextBtn" class="content-nav">下一章</button>
    </div>
</div>

<div class="mask" id="mask">
    <div class="catalog-box">
        <div class="catalog-title">
            <span>章节目录</span>
            <button id="closeCatalog">✕</button>
        </div>
        <div class="catalog-search">
            <input type="text" id="catalogSearch" placeholder="搜索章节标题或内容…">
        </div>
        <div id="catalogList" class="catalog-list"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
