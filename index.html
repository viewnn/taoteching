<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>道德经阅读器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="道德经">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            const swText = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => {
                e.respondWith(fetch(e.request).catch(r => caches.match(e.request)));
            });
            `;
            const blob = new Blob([swText], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>
    <style>
        :root {
            --bg: #fffbf0;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-sub: #505050;
            --border: #dddddd;
            --accent: #8c2222;
            --shadow: rgba(0,0,0,0.08);
            --line-height: 1.80;
            --content-font-size: 18px;
        }
        [data-theme="dark"] {
            --bg: #171717;
            --card-bg: #242424;
            --text-main: #e8e8e8;
            --text-sub: #b1b1b1;
            --border: #383838;
            --accent: #d46060;
            --shadow: rgba(0,0,0,0.35);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, "SimSun", "STSong", serif;
            background-color: var(--bg);
            color: var(--text-main);
            font-size: 18px;
            transition: background 0.3s ease, color 0.3s ease;
            padding-bottom: 100px;
        }
        header {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 99;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 6px var(--shadow);
        }
        .header-title {
            font-size: 21px;
            color: var(--accent);
            font-weight: normal;
        }
        .chapter-type {
            display: inline-block;
            padding: 2px 9px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 4px;
        }
        [data-theme="dark"] .chapter-type {
            opacity: 0.9;
        }
        .toolbar {
            display: flex;
            gap: 6px;
        }
        button {
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
        }
        button:active {
            filter: brightness(0.92);
        }
        .container {
            padding: 16px;
            max-width: 720px;
            margin: 0 auto;
        }
        .tab-wrap {
            display:flex;
            border:1px solid var(--border);
            border-radius:9px;
            overflow:hidden;
            margin-bottom:16px;
        }
        .tab-item {
            flex:1;
            text-align:center;
            padding:11px;
            cursor:pointer;
            background: var(--card-bg);
            transition:0.2s;
        }
        .tab-item.active {
            background: var(--accent);
            color:#fff;
        }
        .content-card {
            background: var(--card-bg);
            padding:24px 20px;
            border-radius:12px;
            box-shadow: 0 3px 12px var(--shadow);
            min-height:360px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .read-content {
            font-size: var(--content-font-size);
            line-height: var(--line-height);
        }
        .view {
            display:none;
        }
        .view.active {
            display:block;
        }
        .chap-title {
            text-align:center;
            font-size:22px;
            margin-bottom:20px;
            color: var(--accent);
        }
        .page-nav {
            display:flex;
            justify-content:space-between;
            margin-top:20px;
        }
        .content-nav {
            font-size: 14px;
            padding: 10px 20px;
        }

        .setting-panel {
            margin-top:16px;
            background:var(--card-bg);
            border-radius:10px;
            padding:14px;
            border:1px solid var(--border);
        }
        .setting-row {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:6px 0;
            gap:10px;
        }
        .setting-label-line{
            display:flex;
            gap:8px;
            align-items:center;
        }
        .value-text{
            color:var(--accent);
            min-width:42px;
            text-align:right;
        }
        .mask {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.45);
            z-index:199;
            display:none;
        }
        .mask.show {display:block;}
        .catalog-box {
            position:fixed;
            top:0;
            right:0;
            width:82%;
            max-width:360px;
            height:100%;
            background:var(--bg);
            padding:20px;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        .catalog-list{
            flex:1;
            min-height:0;
            overflow-y:auto;
            overflow-x:hidden;
            -webkit-overflow-scrolling:touch;
            padding-right:6px;
            scrollbar-width:thin;
            scrollbar-color:var(--accent) transparent;
            touch-action:pan-y;
        }
        .catalog-list::-webkit-scrollbar {
            width: 8px;
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        .catalog-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        .catalog-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
            opacity: 1 !important;
            min-height: 40px;
        }
        .catalog-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        .catalog-list::-webkit-scrollbar-thumb:vertical {
            background-color: var(--accent);
            border-radius: 4px;
        }
        .catalog-title {
            display:flex;
            justify-content:space-between;
            font-size:20px;
            margin-bottom:16px;
            color:var(--accent);
            flex-shrink:0;
        }
        .catalog-search {
            margin-bottom:12px;
            flex-shrink:0;
        }
        .catalog-search input {
            width:100%;
            padding:8px 10px;
            border:1px solid var(--border);
            border-radius:8px;
            background:var(--card-bg);
            color:var(--text-main);
            font-size:15px;
            outline:none;
            transition:border-color 0.2s;
        }
        .catalog-search input:focus {
            border-color:var(--accent);
        }
        .catalog-item {
            padding:9px 6px;
            border-bottom:1px solid var(--border);
            cursor:pointer;
        }
        .catalog-item:active {
            background:var(--card-bg);
        }
        .loading-tip{
            text-align:center;
            padding:40px 0;
            color:var(--text-sub);
        }
    </style>
</head>
<body>
<header>
    <div style="display:flex;align-items:center;gap:8px;">
        <div class="header-title">道德经</div>
        <span id="chapterType" class="chapter-type"></span>
    </div>
    <div class="toolbar">
        <button id="openCatalog">目录</button>
        <button onclick="toggleTheme()">🌓</button>
    </div>
</header>

<div class="container">
    <div class="tab-wrap">
        <div class="tab-item active" data-view="yuanwen">原文</div>
        <div class="tab-item" data-view="zhushi">注释</div>
        <div class="tab-item" data-view="zongjie">总结</div>
    </div>

    <div class="content-card">
        <div class="read-content" id="readWrap">
            <div class="loading-tip">正在加载数据...</div>
            <div class="view active" id="yuanwen">
                <div class="chap-title"></div>
                <div class="yuanwen-text"></div>
            </div>
            <div class="view" id="zhushi">
                <div class="chap-title"></div>
                <div class="zhushi-text"></div>
            </div>
            <div class="view" id="zongjie">
                <div class="chap-title"></div>
                <div class="zongjie-text"></div>
            </div>
        </div>
    </div>

    <div class="page-nav">
        <button id="prevBtn" class="content-nav">上一章</button>
        <button id="copyBtn" class="content-nav">复制原文</button>
        <button id="nextBtn" class="content-nav">下一章</button>
    </div>
</div>

<div class="mask" id="mask">
    <div class="catalog-box">
        <div class="catalog-title">
            <span>章节目录</span>
            <button id="closeCatalog">✕</button>
        </div>
        <div class="catalog-search">
            <input type="text" id="catalogSearch" placeholder="搜索章节标题或内容…">
        </div>
        <div id="catalogList" class="catalog-list"></div>
    </div>
</div>

<script>
// 兼容性 polyfill（部分旧版 webview 不支持 NodeList.forEach / Array.from）
if (!Array.prototype.forEach) {
    Array.prototype.forEach = function(fn, ctx) {
        for (var i = 0; i < this.length; i++) fn.call(ctx, this[i], i, this);
    };
}
if (typeof NodeList !== 'undefined' && NodeList.prototype && !NodeList.prototype.forEach) {
    NodeList.prototype.forEach = Array.prototype.forEach;
}
// 安全的 NodeList 遍历（避免 Array.from / forEach 兼容问题）
function $each(sel, fn) {
    var nl = document.querySelectorAll(sel);
    for (var i = 0; i < nl.length; i++) fn(nl[i], i);
}
// 全局变量
let bookData = [];
let currentIndex = 0;
const storageKey = "daoDeJingReadIndex";

const mask = document.getElementById("mask");
const catalogList = document.getElementById("catalogList");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const readWrap = document.getElementById("readWrap");

// 读取本地阅读记录
function loadProgress() {
    const save = localStorage.getItem(storageKey);
    if(save !== null){
        const idx = parseInt(save);
        if(!isNaN(idx) && idx >=0 && idx < bookData.length){
            currentIndex = idx;
        }
    }
}
function saveProgress(){
    localStorage.setItem(storageKey, currentIndex);
}

// 渲染侧边目录（支持模糊搜索：匹配章节标题、原文、译文）
function renderCatalog(keyword){
    const kw = (keyword || "").trim().toLowerCase();
    catalogList.innerHTML = "";
    for(let i = 0; i < bookData.length; i++){
        const item = bookData[i];
        const haystack = (
            (item.chapter || "") + " " +
            (item.original || "") + " " +
            (item.translation || "")
        ).toLowerCase();
        if(kw && haystack.indexOf(kw) === -1) continue;
        let div = document.createElement("div");
        div.className = "catalog-item";
        div.innerText = item.chapter;
        div.onclick = (function(idx){
            return function(){
                switchChapter(idx);
                mask.classList.remove("show");
            };
        })(i);
        catalogList.appendChild(div);
    }
    if(kw && catalogList.children.length === 0){
        catalogList.innerHTML = '<div class="loading-tip">未找到匹配章节</div>';
    }
}

// 上下章按钮显隐控制
function updateNavBtn(){
    prevBtn.style.visibility = currentIndex <= 0 ? "hidden" : "visible";
    nextBtn.style.visibility = currentIndex >= bookData.length -1 ? "hidden" : "visible";
}

// 将文本按 xlsx 中的真实换行符 \n 同步换行展示
// 同时转义 HTML 特殊字符，避免数据中的 < > 被当作标签执行
function textToHtml(s){
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .replace(/\n/g, "<br>");
}

// 切换章节渲染内容（适配你的json字段）
function switchChapter(index){
    currentIndex = index;
    saveProgress();
    const data = bookData[currentIndex];
    const typeEl = document.getElementById("chapterType");
    if(typeEl) typeEl.innerText = data.type || "";
    $each(".chap-title", function(el){ el.innerText = data.chapter; });
    document.querySelector(".yuanwen-text").innerHTML = textToHtml(data.original);
    document.querySelector(".zhushi-text").innerHTML = textToHtml(data.translation);
    document.querySelector(".zongjie-text").innerHTML = textToHtml(data.summary);
    updateNavBtn();
}

prevBtn.onclick = () => {
    if(currentIndex > 0) switchChapter(currentIndex - 1);
}
nextBtn.onclick = () => {
    if(currentIndex < bookData.length - 1) switchChapter(currentIndex + 1);
}

// 复制当前章节原文到剪贴板
const copyBtn = document.getElementById("copyBtn");
copyBtn.onclick = async () => {
    if(!bookData.length) return;
    const text = bookData[currentIndex].original || "";
    const originalLabel = copyBtn.innerText;
    try {
        await navigator.clipboard.writeText(text);
        copyBtn.innerText = "已复制";
    } catch (err) {
        // 兼容降级方案
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand("copy");
            copyBtn.innerText = "已复制";
        } catch (e) {
            copyBtn.innerText = "复制失败";
        }
        document.body.removeChild(ta);
    }
    setTimeout(()=>{ copyBtn.innerText = originalLabel; }, 1500);
}

// 标签切换
$each(".tab-item", function(tab){
    tab.onclick = function(){
        $each(".tab-item", function(t){ t.classList.remove("active"); });
        this.classList.add("active");
        var viewId = this.dataset.view;
        $each(".view", function(v){ v.classList.remove("active"); });
        document.getElementById(viewId).classList.add("active");
    }
});

// 内容区域左右滑动切换tab（整个内容卡片区域均可滑动）
// 左滑 -> 切换到左边的tab(前一个)；右滑 -> 切换到右边的tab(后一个)
// 已在原文(最左)时无法左滑；已在总结(最右)时无法右滑
(function(){
    const swipeArea = document.querySelector('.content-card');
    if(!swipeArea) return;
    let startX = 0, startY = 0, startT = 0;
    const threshold = 50;      // 最小水平滑动距离(px)
    const maxDuration = 600;   // 滑动最大耗时(ms)
    swipeArea.addEventListener('touchstart', function(e){
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        startT = Date.now();
    }, { passive: true });
    swipeArea.addEventListener('touchend', function(e){
        if(Date.now() - startT > maxDuration) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        if(Math.abs(dx) < threshold) return;            // 滑动距离不足
        if(Math.abs(dx) < Math.abs(dy)) return;         // 垂直滑动为主，避免影响上下滚动
        const tabs = document.querySelectorAll('.tab-item');
        let idx = -1;
        for(let i = 0; i < tabs.length; i++){
            if(tabs[i].classList.contains('active')){ idx = i; break; }
        }
        if(idx < 0) return;
        if(dx < 0){
            // 左滑 -> 左边tab(前一个)
            if(idx > 0) tabs[idx - 1].click();
        } else {
            // 右滑 -> 右边tab(后一个)
            if(idx < tabs.length - 1) tabs[idx + 1].click();
        }
    }, { passive: true });
})();

// 日夜切换
function toggleTheme(){
    if(document.body.dataset.theme === "dark"){
        delete document.body.dataset.theme;
    }else{
        document.body.dataset.theme = "dark";
    }
}

// 目录弹窗
const catalogSearch = document.getElementById("catalogSearch");
document.getElementById("openCatalog").onclick = ()=>{
    mask.classList.add("show");
    catalogSearch.value = "";
    renderCatalog("");
    catalogList.scrollTop = 0;
};
document.getElementById("closeCatalog").onclick = ()=>mask.classList.remove("show");
mask.onclick = (e)=>{
    if(e.target === mask) mask.classList.remove("show");
};
// 目录弹窗：打开时锁定背景滚动，关闭时恢复
(function(){
    const lockBody = function(locked){
        document.body.style.overflow = locked ? 'hidden' : '';
    };
    const _openCatalog = document.getElementById("openCatalog").onclick;
    document.getElementById("openCatalog").onclick = function(){
        _openCatalog.call(this);
        lockBody(true);
    };
    const _closeCatalog = document.getElementById("closeCatalog").onclick;
    document.getElementById("closeCatalog").onclick = function(){
        _closeCatalog.call(this);
        lockBody(false);
    };
    mask.addEventListener('click', function(e){
        if(e.target === mask) lockBody(false);
    });
})();
catalogSearch.addEventListener("input", ()=>{
    renderCatalog(catalogSearch.value);
});

// 加载外部book.xlsx 核心接入逻辑
async function loadBookJson() {
    try {
        const res = await fetch("./book.xlsx");
        if (!res.ok) throw new Error("xlsx文件读取失败，请检查文件路径");
        const buf = await res.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rawArr = XLSX.utils.sheet_to_json(ws, { defval: "" });
        // 过滤空行、空白章节
        bookData = rawArr.filter(item => {
            const ch = String(item.chapter || "");
            return ch.trim() !== "";
        });
        // 确保4个字段存在（缺失时补空字符串）
        bookData = bookData.map(item => ({
            chapter: String(item.chapter || ""),
            original: String(item.original || ""),
            translation: String(item.translation || ""),
            summary: String(item.summary || ""),
            type: String(item.type || ""),
        }));
        // 清除加载提示
        readWrap.innerHTML = `
            <div class="view active" id="yuanwen">
                <div class="chap-title"></div>
                <div class="yuanwen-text"></div>
            </div>
            <div class="view" id="zhushi">
                <div class="chap-title"></div>
                <div class="zhushi-text"></div>
            </div>
            <div class="view" id="zongjie">
                <div class="chap-title"></div>
                <div class="zongjie-text"></div>
            </div>
        `;
        // 初始化页面
        loadProgress();
        renderCatalog();
        switchChapter(currentIndex);
    } catch (err) {
        readWrap.innerHTML = `<div class="loading-tip" style="color:#c33">数据加载失败：${err.message}<br>请确保html与book.xlsx放在同一文件夹，且SheetJS库已正常加载</div>`;
        console.error("XLSX加载错误：", err);
    }
}

// 页面启动加载xlsx
loadBookJson();
</script>
</body>
</html>
